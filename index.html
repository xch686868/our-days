<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>我们的小日子</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小日子">
<meta name="theme-color" content="#FFF6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#140C10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Noto+Serif+SC:wght@600;700&family=Ma+Shan+Zheng&display=swap">
<script src="config.js"></script>
<style>
/* 设计：像 iPhone 原生 App —— 大标题、毛玻璃底部导航、底部弹出面板；玫瑰色点缀，合照做首页主角。 */
:root{
  --bg:#FFF6F7; --bg2:#FDECEF; --card:#FFFFFF; --ink:#2A1820; --ink2:#5E4652; --muted:#9A8590;
  --line:rgba(120,40,70,.10); --fill:rgba(120,40,70,.06);
  --rose:#E8466F; --rose-ink:#FFFFFF; --rose-soft:#FFE3EA; --coral:#FF8A72;
  --mint:#2FA37E; --mint-soft:#DDF4EC; --gold:#E9A23B; --gold-soft:#FFF0D6;
  --glass:rgba(255,250,251,.78);
  --shadow:0 1px 2px rgba(90,20,45,.05),0 8px 24px rgba(90,20,45,.07);
  --n1:#FFF0B8; --n2:#FFDCE5; --n3:#DCEBFF; --n4:#DFF4DA; --note-ink:#3A2A1E;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-title:"Noto Serif SC","Songti SC","STSong",serif;
  --f-num:"Fraunces","Didot","Georgia",serif;
  --f-hand:"Ma Shan Zheng","Kaiti SC","STKaiti",cursive;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#140C10; --bg2:#1E1218; --card:#22161C; --ink:#F7EAF0; --ink2:#D5BFCA; --muted:#A08A96;
  --line:rgba(255,200,220,.10); --fill:rgba(255,200,220,.07);
  --rose:#FF6189; --rose-ink:#FFFFFF; --rose-soft:#3E1D29; --coral:#FF9A85;
  --mint:#5ACCA6; --mint-soft:#183A2F; --gold:#F2B85C; --gold-soft:#3A2C14;
  --glass:rgba(30,18,24,.78);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --n1:#EBD58E; --n2:#F0BFCC; --n3:#BCD4EE; --n4:#C5E3BD; --note-ink:#2B2016;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- shell ---------- */
.page{min-height:100%;padding:calc(var(--sat) + 10px) max(18px,var(--sar)) calc(var(--sab) + 104px) max(18px,var(--sal));max-width:560px;margin:0 auto}
.page.enter{animation:pageIn .28s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.bigtitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.bigtitle h1{font-family:var(--f-title);font-size:32px;line-height:1.15;margin:0;letter-spacing:.01em}
.bigtitle .sub{font-size:13px;color:var(--muted);margin-bottom:2px}
.round{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink2);flex:none}
.round svg{width:20px;height:20px}
.round.rose{background:var(--rose);color:var(--rose-ink)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-top:.5px solid var(--line);padding:6px max(10px,var(--sar)) calc(var(--sab) + 6px) max(10px,var(--sal))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:10.5px;font-weight:500;position:relative}
.tab svg{width:26px;height:26px}
.tab .on{display:none}
.tab[aria-current="page"]{color:var(--rose)}
.tab[aria-current="page"] .off{display:none}
.tab[aria-current="page"] .on{display:block}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--rose);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}

.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.04em;margin:6px 4px -4px}

/* ---------- home ---------- */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}
.hello .t{font-size:14px;color:var(--muted)}
.hello .n{font-family:var(--f-title);font-size:22px;font-weight:700;line-height:1.2}
.hero{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;max-height:62vh;width:100%;background:linear-gradient(160deg,#FFB3C1 0%,#FF8A9E 45%,#E8466F 100%);color:#fff;box-shadow:0 18px 40px -18px rgba(232,70,111,.55)}
.hero.short{aspect-ratio:auto;min-height:300px}
.hero img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 45%,rgba(40,5,20,.72) 100%)}
.hero .blob{position:absolute;border-radius:50%;filter:blur(2px);background:rgba(255,255,255,.18)}
.hero .top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.pair{display:flex;align-items:center}
.ava{width:44px;height:44px;border-radius:50%;border:2.5px solid #fff;background:#fff center/cover no-repeat;color:var(--rose);display:grid;place-items:center;font-family:var(--f-title);font-weight:700;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden}
.pair .ava + .ava{margin-left:-12px}
.pair .heart{width:22px;height:22px;margin:0 -4px 0 6px;color:#fff;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));animation:beat 1.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.2)}28%{transform:scale(1)}42%{transform:scale(1.12)}}
.photo-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;padding:7px 12px;color:#fff}
.photo-btn svg{width:16px;height:16px}
.hero .bottom{position:absolute;left:20px;right:20px;bottom:18px}
.hero .lbl{font-size:14px;letter-spacing:.2em;opacity:.92}
.hero .days{font-family:var(--f-num);font-style:italic;font-weight:600;font-size:clamp(76px,24vw,112px);line-height:.95;letter-spacing:-.02em;text-shadow:0 4px 24px rgba(0,0,0,.18)}
.hero .days small{font-family:var(--f-title);font-style:normal;font-size:22px;font-weight:700;margin-left:6px;letter-spacing:0}
.hero .since{font-size:13px;opacity:.9;margin-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:12px;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:4px 10px}

.next{display:flex;align-items:center;gap:14px;padding:16px}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-style:italic;font-weight:600;font-size:22px;color:var(--rose)}
.next .txt{min-width:0;flex:1}
.next .k{font-size:12px;color:var(--muted)}
.next .t{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .d{font-size:13px;color:var(--ink2)}
.chev{color:var(--muted);flex:none}
.chev svg{width:18px;height:18px;flex:none;color:var(--muted)}
.install .share svg{width:15px;height:15px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mood{padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0;min-height:120px}
.mood .row{display:flex;align-items:center;gap:8px}
.mood .ava{width:26px;height:26px;border-width:1.5px;font-size:12px;box-shadow:none;border-color:var(--card)}
.mood .who{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood .face{font-size:34px;line-height:1}
.mood .say{font-size:14px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.mood .say.dim{color:var(--muted);font-weight:500}
.mood.mine{outline:2px solid var(--rose-soft)}

.mini{padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.mini .head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--rose));border-radius:4px}
.quote{font-family:var(--f-hand);font-size:22px;line-height:1.4;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.install{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft)}
.install .ic{width:40px;height:40px;border-radius:10px;flex:none;overflow:hidden}
.install b{display:block;font-size:15px}
.install p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.install .share{display:inline-block;width:15px;height:15px;vertical-align:-2px;color:#0A84FF}
.install .x{margin-left:auto;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}

/* ---------- dates ---------- */
.dlist{display:flex;flex-direction:column;gap:12px}
.ditem{display:flex;align-items:center;gap:14px;padding:14px 16px}
.dic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.dic svg{width:24px;height:24px}
.dic.rose{background:var(--rose-soft);color:var(--rose)}
.dic.mint{background:var(--mint-soft);color:var(--mint)}
.dic.gold{background:var(--gold-soft);color:var(--gold)}
.ditem .txt{flex:1;min-width:0}
.ditem .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ditem .s{font-size:13px;color:var(--muted)}
.ditem .n{text-align:right;line-height:1;flex:none}
.ditem .n b{font-family:var(--f-num);font-style:italic;font-weight:600;font-size:30px;color:var(--rose)}
.ditem .n small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.ditem .n .today{font-family:var(--f-title);font-size:16px;font-weight:700;color:var(--rose)}
.ditem.past .n b{color:var(--muted)}
.ditem.first{background:linear-gradient(135deg,var(--rose) 0%,var(--coral) 100%);color:#fff}
.ditem.first .s,.ditem.first .n small{color:rgba(255,255,255,.85)}
.ditem.first .n b,.ditem.first .n .today{color:#fff}
.ditem.first .dic{background:rgba(255,255,255,.22);color:#fff}

/* ---------- todos ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;margin-bottom:14px}
.seg button{border-radius:8px;padding:6px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.adder{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;margin-bottom:14px}
.adder input{flex:1;border:0;background:transparent;padding:8px 0;min-width:0;outline:none;font-size:16px}
.tlist{list-style:none;margin:0;padding:0;overflow:hidden}
.titem{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:.5px solid var(--line);transition:opacity .3s}
.titem:first-child{border-top:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:all .2s}
.check svg{width:15px;height:15px}
.titem.done .check{background:var(--mint);border-color:var(--mint);color:#fff}
.titem .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.titem .s{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.titem.done .txt>span{color:var(--muted);text-decoration:line-through}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sugg button{border:1.5px dashed var(--rose);color:var(--rose);border-radius:999px;padding:6px 12px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:15px}
.empty svg{width:56px;height:56px;color:var(--rose);opacity:.55}
.more{color:var(--muted);padding:4px 6px;flex:none}
.more svg{width:20px;height:20px}

/* ---------- notes ---------- */
.composer{padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.composer textarea{border:0;background:var(--fill);border-radius:14px;padding:12px;min-height:88px;resize:none;outline:none;font-size:16px}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sw{display:flex;gap:8px}
.sw button{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--rose)}
.btn{background:var(--rose);color:var(--rose-ink);border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px}
.btn.block{width:100%;padding:14px;border-radius:16px;font-size:17px}
.btn.ghost{background:var(--fill);color:var(--ink)}
.btn:disabled{opacity:.5}
.wall{columns:2;column-gap:12px}
@media (max-width:340px){.wall{columns:1}}
.note{break-inside:avoid;margin-bottom:12px;border-radius:6px 6px 22px 6px;padding:14px 14px 10px;color:var(--note-ink);box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(60,20,30,.08);display:flex;flex-direction:column;gap:8px;transform:rotate(var(--r,0deg))}
.note p{margin:0;font-family:var(--f-hand);font-size:21px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.note .meta{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;opacity:.7;gap:6px}
.note .acts{display:flex;justify-content:space-between;align-items:center}
.like{display:flex;align-items:center;gap:4px;font-size:13px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.5)}
.like svg{width:16px;height:16px}
.like.on{color:#D6335E}
.c1{background:var(--n1)}.c2{background:var(--n2)}.c3{background:var(--n3)}.c4{background:var(--n4)}

.inapp{background:var(--rose);color:#fff;padding:calc(var(--sat) + 10px) max(18px,var(--sar)) 10px max(18px,var(--sal));display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.5}
.inapp b{font-size:15px}
.install .btn.sm{display:inline-block}

/* ---------- top chips ---------- */
.chips{display:flex;gap:8px;margin:-4px 0 16px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 14px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600;color:var(--ink2);position:relative}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips .dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--bg)}

/* ---------- letters ---------- */
.envs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.env{position:relative;aspect-ratio:1.45;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:block;width:100%;background:var(--envc,var(--n2))}
.env .flap{position:absolute;left:0;right:0;top:0;height:56%;background:var(--envc,var(--n2));filter:brightness(.92);clip-path:polygon(0 0,100% 0,50% 100%);transition:clip-path .4s}
.env .seal{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F06A8C,#C9244F);color:#fff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(120,10,40,.35)}
.env .seal svg{width:16px;height:16px}
.env .lab{position:absolute;left:8px;right:8px;bottom:7px;font-family:var(--f-hand);font-size:16px;line-height:1.2;color:var(--note-ink);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.env.opened .flap{clip-path:polygon(0 0,100% 0,50% 22%)}
.env.opened .seal{background:rgba(0,0,0,.12);box-shadow:none;color:var(--note-ink);width:auto;height:auto;padding:2px 8px;border-radius:999px;font-size:11px;top:44%}
.env.opened{opacity:.82}
.e1{--envc:var(--n1)}.e2{--envc:var(--n2)}.e3{--envc:var(--n3)}.e4{--envc:var(--n4)}
.paper{background:#FFFBF2;color:#3A2A1E;border-radius:18px;padding:22px 20px 18px;box-shadow:0 10px 30px -10px rgba(90,40,20,.35);background-image:repeating-linear-gradient(180deg,transparent 0 33px,rgba(190,120,90,.2) 33px 34px);background-position:0 58px;margin-bottom:16px}
.paper .lab{font-size:12px;letter-spacing:.08em;color:#B0705A;font-weight:700}
.paper .to,.paper .sign{font-family:var(--f-hand);font-size:22px;line-height:34px}
.paper .sign{text-align:right}
.paper p{font-family:var(--f-hand);font-size:22px;line-height:34px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.paper .when{font-size:12px;color:#A0857A;text-align:right}
.lcard{display:flex;gap:14px;align-items:center;padding:16px;width:100%;text-align:left}
.lcard .mini-env{width:54px;height:40px;flex:none;border-radius:8px;position:relative;overflow:hidden;background:var(--n2)}
.lcard .mini-env::before{content:"";position:absolute;inset:0 0 45% 0;background:var(--n2);filter:brightness(.9);clip-path:polygon(0 0,100% 0,50% 100%)}
.lcard .mini-env::after{content:"";position:absolute;left:50%;top:55%;width:14px;height:14px;border-radius:50%;background:#D6335E;transform:translate(-50%,-50%)}
.lcard .txt{flex:1;min-width:0}
.lcard .t{font-weight:700;font-size:16px}
.lcard .s{font-size:13px;color:var(--ink2);margin-top:2px}
.lcard.hot{background:linear-gradient(135deg,var(--rose) 0%,var(--coral) 100%);color:#fff}
.lcard.hot .s{color:rgba(255,255,255,.9)}
.lcard .ok{background:rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;flex:none}
.typegrid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.typegrid button{padding:7px 12px;border-radius:999px;background:var(--card);font-size:14px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.typegrid button[aria-pressed="true"]{background:var(--rose);color:#fff;box-shadow:none}
.tip{background:var(--gold-soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink2);margin-bottom:12px;line-height:1.6}
.tip b{color:var(--ink)}
.bigta{width:100%;border:0;background:var(--card);border-radius:14px;padding:14px;min-height:180px;resize:vertical;outline:none;font-size:16px;line-height:1.6;margin-bottom:12px}
.status{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;flex:none}
.status.wait{background:var(--fill);color:var(--muted)}
.status.open{background:var(--rose-soft);color:var(--rose)}

/* ---------- coupons ---------- */
.tickets{display:flex;flex-direction:column;gap:14px}
.ticket{display:flex;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:var(--card);position:relative}
.ticket .l{width:86px;flex:none;background:linear-gradient(160deg,var(--coral),var(--rose));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px;font-family:var(--f-title);font-weight:700;font-size:13px;letter-spacing:.1em}
.ticket .l svg{width:28px;height:28px}
.ticket .r{flex:1;min-width:0;padding:14px 16px;border-left:2px dashed var(--line);display:flex;flex-direction:column;gap:2px}
.ticket::before,.ticket::after{content:"";position:absolute;left:78px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.ticket::before{top:-8px}.ticket::after{bottom:-8px}
.ticket .t{font-family:var(--f-title);font-weight:700;font-size:19px;overflow-wrap:anywhere}
.ticket .s{font-size:13px;color:var(--muted)}
.ticket .n{font-size:14px;color:var(--ink2);overflow-wrap:anywhere}
.ticket .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.ticket.used .l{background:var(--muted)}
.ticket.used .t{color:var(--muted)}
.btn.sm{padding:7px 14px;font-size:13px}

/* ---------- scratch cards ---------- */
.scard{position:relative;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);background:linear-gradient(150deg,var(--gold-soft),var(--rose-soft));aspect-ratio:16/10;margin-bottom:10px;user-select:none;-webkit-user-select:none}
.scard .prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;text-align:center}
.scard .tier{font-family:var(--f-title);font-weight:700;font-size:15px;letter-spacing:.2em;color:var(--rose);background:var(--card);border-radius:999px;padding:3px 14px}
.scard .pz{font-family:var(--f-title);font-weight:700;font-size:26px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.scard .by{font-size:13px;color:var(--ink2)}
.scard canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity .45s}
.scard.t1{background:linear-gradient(150deg,#FFE8A3,#FFC2D1)}
.scard.t1 .tier{background:var(--gold);color:#fff}
.shint{font-size:13px;color:var(--muted);text-align:center;margin:0 0 18px}
.odds{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-bottom:12px}
.odds b{font-family:var(--f-title);font-size:14px;color:var(--rose);white-space:nowrap}
.odds span{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.burst{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.burst i{position:absolute;top:-30px;font-style:normal;font-size:22px;animation:fallDown 2.6s ease-in forwards}
@keyframes fallDown{to{transform:translateY(110vh) rotate(var(--rot,180deg));opacity:.2}}

/* ---------- date wheel ---------- */
.wheelbox{position:relative;width:min(100%,330px);aspect-ratio:1;margin:4px auto 14px}
.wheel{width:100%;height:100%;border-radius:50%;box-shadow:var(--shadow),0 0 0 6px var(--card);transition:transform 4.2s cubic-bezier(.12,.75,.12,1)}
.wheel svg{width:100%;height:100%;display:block}
.wheelbox .pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--rose);filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));z-index:2}
.wheelbox .hub{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:var(--rose);color:#fff;font-family:var(--f-title);font-weight:700;font-size:17px;box-shadow:0 4px 14px rgba(232,70,111,.35),0 0 0 5px var(--card);z-index:2}
.wheelbox .hub:disabled{opacity:.85}
.dlv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-4px 0 12px}
.dlv button{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 0;border-radius:14px;background:var(--fill);font-weight:700;font-size:14px;color:var(--ink2);white-space:nowrap}
.dlv button span{font-size:16px}
.dlv button[aria-pressed="true"].lv1{background:linear-gradient(135deg,#FFB3C7,#FF8FAB);color:#fff}
.dlv button[aria-pressed="true"].lv2{background:linear-gradient(135deg,#B57BFF,#E8466F);color:#fff}
.dlv button[aria-pressed="true"].lv3{background:linear-gradient(135deg,#FF5E62,#B3123E);color:#fff}
.dlv button[aria-pressed="true"].lv4{background:linear-gradient(135deg,#C2185B,#2A0A1E);color:#fff}
.dturn{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px;font-size:15px;color:var(--ink2)}
.dturn b{color:var(--rose);font-weight:700}
.dbox{border-radius:24px;padding:18px 16px 14px;color:#fff;box-shadow:var(--shadow)}
.dbox.lv1{background:linear-gradient(160deg,#FF9DB5 0%,#FF7A9C 100%)}
.dbox.lv2{background:linear-gradient(160deg,#9B5DE5 0%,#E8466F 100%)}
.dbox.lv3{background:linear-gradient(160deg,#E8344E 0%,#7A0B2C 100%)}
.dbox.lv4{background:linear-gradient(160deg,#A0124F 0%,#2A0A1E 100%)}
.dice3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.die{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:12px 6px;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.die .k{font-size:12px;opacity:.8;font-weight:600}
.die .v{font-family:var(--f-title);font-size:17px;font-weight:700;line-height:1.3}
.die.rolling{animation:dshake .18s infinite}
@keyframes dshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) translateY(-2px)}75%{transform:rotate(6deg) translateY(2px)}}
.dsent{margin:16px 4px 16px;text-align:center;font-size:16px;font-weight:600;line-height:1.5}
.dcard{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:20px;min-height:170px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center;margin-bottom:16px}
.dcard .tag{align-self:center;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.22)}
.dcard .t{font-family:var(--f-title);font-size:20px;font-weight:700;line-height:1.45}
.dcard.show{animation:dflip .45s ease}
.dcard.rolling{animation:dshake .18s infinite}
@keyframes dflip{from{transform:rotateY(90deg);opacity:.3}to{transform:none;opacity:1}}
.dgo{background:#fff;color:var(--rose)}
.dbox.lv3 .dgo{color:#B3123E}
.dbox.lv4 .dgo{color:#A0124F}
.dmine{margin-top:16px;padding:14px 14px 6px}
.dmine summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px;padding-bottom:8px}
.dmine summary::-webkit-details-marker{display:none}
.dmine summary small{font-weight:500;color:var(--muted);font-size:13px}
.dmine .hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 10px}
.dmine .row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.dmine .row .input{background:var(--fill);flex:1;min-width:0}
.dmine .seg{margin-bottom:10px}
.dmine ul{list-style:none;margin:0;padding:0}
.dmine li{display:flex;align-items:flex-start;gap:8px;padding:10px 2px;border-top:.5px solid var(--line);font-size:14.5px;line-height:1.5}
.dmine li .k{flex:none;font-size:12px;font-weight:700;color:var(--rose);padding-top:2px}
.dmine li .t{flex:1;min-width:0}
.dmine li button{flex:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.dskip{display:block;margin:10px auto 0;color:rgba(255,255,255,.85);font-size:14px;font-weight:500}
.dnote{margin:14px 8px 0;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.6}
.wrow{display:flex;gap:10px;margin-bottom:18px}
.wrow .btn{flex:1}
.plan{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:.5px solid var(--line)}
.plan:first-child{border-top:0}
.plan .ic{font-size:22px;line-height:1.2;flex:none}
.plan .tx{flex:1;min-width:0}
.plan .t{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.plan .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.plan.done .t{color:var(--muted);text-decoration:line-through}
.dresult{text-align:center;padding:6px 0 4px}
.dresult .ic{font-size:44px;line-height:1.2}
.dresult .t{font-family:var(--f-title);font-weight:700;font-size:26px;margin:6px 0 4px}
.dresult .d{color:var(--ink2);font-size:15px;margin-bottom:18px}

/* ---------- places ---------- */
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pstats .card{padding:14px 16px}
.pstats b{display:block;font-family:var(--f-num);font-style:italic;font-weight:600;font-size:36px;line-height:1;color:var(--rose)}
.pstats span{font-size:13px;color:var(--muted)}
.stamps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stamp{background:var(--card);border-radius:6px;padding:7px;box-shadow:var(--shadow);transform:rotate(var(--r,0deg));text-align:left;width:100%}
.stamp .in{border:1.5px dashed rgba(232,70,111,.4);border-radius:3px;padding:14px 10px 10px;min-height:128px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.stamp .city{font-family:var(--f-title);font-size:24px;font-weight:700;color:var(--rose);line-height:1.15;overflow-wrap:anywhere;padding-right:30px}
.stamp .pl{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.stamp .dt{font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px}
.stamp .mark{position:absolute;right:-14px;top:-14px;width:60px;height:60px;border:2px solid rgba(232,70,111,.28);border-radius:50%;display:grid;place-items:center;transform:rotate(-18deg)}
.stamp .mark::after{content:"";width:42px;height:42px;border:1.5px solid rgba(232,70,111,.22);border-radius:50%}

/* ---------- manual ---------- */
.mwho{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mwho button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--fill);font-weight:700;font-size:15px;min-width:0}
.mwho button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mwho .ava{width:32px;height:32px;border:0;box-shadow:none;font-size:13px;background-color:var(--rose-soft);flex:none}
.mwho button[aria-pressed="true"]{background:var(--card);box-shadow:0 0 0 2px var(--rose)}
.mlist{overflow:hidden}
.mrow{display:block;width:100%;text-align:left;padding:14px 16px;border-top:.5px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .k{font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.mrow .v{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.mrow .v.dim{color:var(--muted);font-size:15px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,5,12,.38);z-index:40;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:calc(100% - var(--sat) - 24px);overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px max(18px,var(--sar)) calc(var(--sab) + 22px) max(18px,var(--sal));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{font-family:var(--f-title);font-size:22px;margin:4px 0 16px;text-align:center}
.group{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:16px}
.group .gt{font-size:12px;color:var(--muted);margin:0 4px 6px;font-weight:600;letter-spacing:.04em}
.field{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:.5px solid var(--line);min-height:50px}
.field:first-child{border-top:0}
.field>span{flex:none;color:var(--ink);font-size:16px}
.field input[type=text],.field input[type=date]{flex:1;min-width:0;border:0;background:transparent;text-align:right;outline:none;font-size:16px;color:var(--ink2)}
.field input[type=date]{-webkit-appearance:none;appearance:none;min-height:24px}
.field input::-webkit-date-and-time-value{text-align:right}
.field.btnrow{justify-content:space-between;width:100%;text-align:left}
.field.btnrow .val{color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px}
.field .ava{width:34px;height:34px;border:0;box-shadow:none;background-color:var(--rose-soft);font-size:14px}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.toggle i{position:absolute;inset:0;border-radius:16px;background:var(--fill);transition:background .2s;pointer-events:none}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked+i{background:var(--mint)}
.toggle input:checked+i::after{transform:translateX(20px)}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.moods button{background:var(--card);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink2)}
.moods button span{font-size:30px;line-height:1}
.moods button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--rose);color:var(--rose);font-weight:700}
.input{width:100%;border:0;background:var(--card);border-radius:14px;padding:13px 16px;outline:none;font-size:16px}
.codebox{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:17px;letter-spacing:.06em;text-align:center;padding:14px;background:var(--card);border-radius:14px;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 16px;line-height:1.55}
.danger{color:#D6335E}
.actions{display:flex;flex-direction:column;gap:10px}
.who2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.who2 button{background:var(--card);border-radius:20px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:700;font-size:17px;box-shadow:var(--shadow)}
.who2 .ava{width:64px;height:64px;font-size:26px;border:0;background-color:var(--rose-soft)}
.who2 button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--rose)}

/* ---------- onboarding ---------- */
.ob{min-height:100%;display:flex;flex-direction:column;padding:calc(var(--sat) + 24px) max(24px,var(--sar)) calc(var(--sab) + 28px) max(24px,var(--sal));max-width:480px;margin:0 auto;animation:pageIn .3s ease both}
.ob .art{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:20px 0}
.ob .logo{width:112px;height:112px;border-radius:26px;box-shadow:0 18px 40px -14px rgba(232,70,111,.6);overflow:hidden}
.ob h1{font-family:var(--f-title);font-size:34px;margin:6px 0 0}
.ob p.lead{color:var(--ink2);margin:0;font-size:16px;max-width:300px}
.ob .feat{display:grid;gap:10px;margin:8px 0 0;text-align:left;width:100%;max-width:320px}
.ob .feat div{display:flex;gap:12px;align-items:center;font-size:15px;color:var(--ink2)}
.ob .feat .dic{width:36px;height:36px;border-radius:11px}
.ob .feat .dic svg{width:19px;height:19px}
.ob h2{font-family:var(--f-title);font-size:26px;margin:10px 0 6px}
.ob .back{align-self:flex-start;color:var(--rose);font-size:16px;display:flex;align-items:center;gap:2px;padding:4px 0}
.ob .back svg{width:20px;height:20px}

.toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:60;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sync{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);margin-top:22px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--mint)}
.sync.off i{background:var(--gold)}
</style>
</head>

/* =============== dates =============== */
const DAY = 86400000;
const parseD = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return (y && m && d) ? new Date(y, m - 1, d) : null; };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const diff = (a, b) => Math.round((b - a) / DAY);
const onYear = (y, m, d) => new Date(y, m, Math.min(d, new Date(y, m + 1, 0).getDate()));
function nextYearly(dt){ const t = today(); let n = onYear(t.getFullYear(), dt.getMonth(), dt.getDate()); if (n < t) n = onYear(t.getFullYear() + 1, dt.getMonth(), dt.getDate()); return n; }
const W = '日一二三四五六';
const fmt = d => d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
const fmtMD = d => (d.getMonth() + 1) + '月' + d.getDate() + '日';
const fmtW = d => fmtMD(d) + ' 周' + W[d.getDay()];
function ymd(start){ const t = today(); let y = t.getFullYear() - start.getFullYear(), m = t.getMonth() - start.getMonth(), d = t.getDate() - start.getDate();
  if (d < 0){ m--; d += new Date(t.getFullYear(), t.getMonth(), 0).getDate(); } if (m < 0){ y--; m += 12; } return {y, m, d}; }
function ago(ms){ const s = (Date.now() - ms) / 1000; if (s < 60) return '刚刚'; if (s < 3600) return Math.floor(s / 60) + '分钟前'; if (s < 86400) return Math.floor(s / 3600) + '小时前';
  const d = new Date(ms); return s < 7 * 86400 ? Math.floor(s / 86400) + '天前' : fmtMD(d); }
const MILESTONES = (() => { const a = []; for (let k = 100; k <= 20000; k += 100) a.push(k); a.push(52, 99, 520, 1314, 3344, 5200, 9999); return a.sort((x, y) => x - y); })();
const nextMilestone = n => { const d = MILESTONES.find(x => x >= n); return d ? {day: d, left: d - n} : null; };

/* =============== store: local cache + optional Supabase sync =============== */
const CFG = window.APP_CONFIG || {};
const REMOTE = !!(CFG.url && CFG.key);
const Store = {
  room: null, items: {}, since: null, queue: [], online: null, timer: null, listeners: [],
  open(room){
    this.room = room;
    const c = lsGet('od-cache-' + room, null) || {};
    this.items = c.items || {}; this.since = c.since || null; this.queue = c.queue || [];
  },
  persist(){ lsSet('od-cache-' + this.room, {items: this.items, since: this.since, queue: this.queue}); },
  emit(){ this.listeners.forEach(f => f()); },
  all(kind){ return Object.keys(this.items).filter(id => this.items[id].kind === kind).map(id => Object.assign({id}, this.items[id].data)); },
  get(id){ const it = this.items[id]; return it ? it.data : null; },
  put(id, kind, data){
    this.items[id] = {kind, data};
    if (REMOTE) this.queue.push({op: 'put', id, kind, data});
    this.persist(); this.emit(); this.flush();
  },
  remove(id){
    const kind = this.items[id] && this.items[id].kind;
    delete this.items[id];
    if (REMOTE) this.queue.push({op: 'put', id, kind: kind || 'x', data: {deleted: true}});
    this.persist(); this.emit(); this.flush();
  },
  async rpc(fn, body){
    const headers = {'apikey': CFG.key, 'Content-Type': 'application/json'};
    if (!/^sb_/.test(CFG.key)) headers['Authorization'] = 'Bearer ' + CFG.key;
    const r = await fetch(CFG.url.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {method: 'POST', headers, body: JSON.stringify(body)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text(); return t ? JSON.parse(t) : null;
  },
  flushing: false,
  async flush(){
    if (!REMOTE || this.flushing || !this.queue.length) return;
    this.flushing = true;
    try {
      while (this.queue.length){
        const q = this.queue[0];
        await this.rpc('room_put', {p_room: this.room, p_id: q.id, p_kind: q.kind, p_data: q.data});
        this.queue.shift(); this.persist();
      }
      this.setOnline(true);
    } catch (e) { this.setOnline(false); }
    this.flushing = false;
  },
  async pull(){
    if (!REMOTE) return true;
    try {
      await this.flush();
      const since = this.since ? new Date(new Date(this.since).getTime() - 5000).toISOString() : null;
      const rows = await this.rpc('room_items', {p_room: this.room, p_since: since}) || [];
      let changed = false;
      const pendingIds = new Set(this.queue.map(q => q.id));
      rows.forEach(r => {
        if (!this.since || r.updated_at > this.since) this.since = r.updated_at;
        if (pendingIds.has(r.id)) return;
        const cur = this.items[r.id];
        if (r.data && r.data.deleted){ if (cur){ delete this.items[r.id]; changed = true; } return; }
        if (!cur || JSON.stringify(cur.data) !== JSON.stringify(r.data)){ this.items[r.id] = {kind: r.kind, data: r.data}; changed = true; }
      });
      this.persist(); this.setOnline(true);
      if (changed) this.emit();
      return true;
    } catch (e) { this.setOnline(false); return false; }
  },
  setOnline(v){ if (this.online !== v){ this.online = v; const s = document.getElementById('syncState'); if (s) renderSync(s); } },
  start(){
    if (!REMOTE) return;
    this.pull();
    clearInterval(this.timer);
    this.timer = setInterval(() => { if (!document.hidden) this.pull(); }, 4000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.pull(); });
    window.addEventListener('online', () => this.pull());
  }
};

/* =============== photos =============== */
function pickImage(maxSide, quality){
  return new Promise(resolve => {
    const inp = $('#filePick'); inp.value = '';
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return resolve(null);
      const img = new Image(); const url = URL.createObjectURL(f);
      img.onload = () => {
        const s = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); toast('这张图片打不开，换一张试试'); resolve(null); };
      img.src = url;
    };
    inp.click();
  });
}

function allDates(){
  const i = info(); const t = today(); const out = [];
  const start = parseD(i.start);
  if (start){
    const nx = nextYearly(start); const y = nx.getFullYear() - start.getFullYear();
    if (y >= 1) out.push({title: '在一起 ' + y + ' 周年', when: nx, left: diff(t, nx), ic: 'rings', tone: 'rose', sub: fmt(nx)});
    const ms = nextMilestone(diff(start, t) + 1);
    if (ms){ const w = new Date(t.getFullYear(), t.getMonth(), t.getDate() + ms.left); out.push({title: '在一起第 ' + ms.day + ' 天', when: w, left: ms.left, ic: 'star', tone: 'gold', sub: fmt(w)}); }
  }
  [['A', i.birthA], ['B', i.birthB]].forEach(([k, b]) => { const d = parseD(b); if (!d) return; const nx = nextYearly(d);
    out.push({title: nameOf(k) + ' 的生日', when: nx, left: diff(t, nx), ic: 'cake', tone: 'mint', sub: fmtMD(d) + ' · ' + (nx.getFullYear() - d.getFullYear()) + ' 岁'}); });
  Store.all('date').forEach(d => { const dt = parseD(d.date); if (!dt) return;
    if (d.repeat){ const nx = nextYearly(dt); const y = nx.getFullYear() - dt.getFullYear(); out.push({id: d.id, title: d.title, when: nx, left: diff(t, nx), ic: 'flag', tone: 'rose', sub: fmtMD(dt) + (y > 0 ? ' · 第 ' + y + ' 年' : '') + ' · 每年'}); }
    else { const l = diff(t, dt); out.push({id: d.id, title: d.title, when: dt, left: l, ic: 'flag', tone: 'rose', sub: fmt(dt), past: l < 0}); } });
  return out.sort((a, b) => (a.past - b.past) || (a.past ? b.left - a.left : a.left - b.left));
}

function writeLetter(cur, presetLabel){

  const drawTypes = () => { types.textContent = ''; LETTER_TYPES.forEach(([t]) => types.append(h('button', {'aria-pressed': String(label === t && !custom.value.trim()), text: t, onclick: () => { label = t; custom.value = ''; drawTypes(); drawTip(); }}))); };

  const ta = h('textarea', {class: 'bigta', id: 'lText', maxlength: '1500', placeholder: '亲爱的' + nameOf(other(S.me)) + '：'});
  ta.value = cur ? cur.text : lsGet('od-ldraft', '');
  if (!cur) ta.addEventListener('input', () => lsSet('od-ldraft', ta.value));
  const sw = h('div', {class: 'sw'});
  const drawSw = () => { sw.textContent = ''; ['1', '2', '3', '4'].forEach(c => sw.append(h('button', {class: 'c' + c, 'aria-pressed': String(color === c), 'aria-label': '信封颜色' + c, onclick: () => { color = c; drawSw(); }}))); };
  drawSw();
  openSheet(cur ? '修改这封信' : '写一封「需要时打开」的信', h('div', null,
    h('div', {class: 'label', style: {margin: '0 4px 8px'}, text: '什么时候打开'}), types, custom, tip, ta,

    h('div', {class: 'actions'},

        const text = ta.value.trim(); const lab = (custom.value.trim() || label).slice(0, 14);

        Store.put(cur ? cur.id : 'l_' + uid(), 'letter', data);
        if (!cur) lsSet('od-ldraft', '');
        closeSheet(); toast(cur ? '改好了' : '信封好了，' + nameOf(other(S.me)) + ' 会在需要时打开'); haptic();
      }}),

function diceMineSave(){ try { localStorage.setItem('od_dice_mine', JSON.stringify(S.diceMine)); } catch {} }
function diceList(mode){
  const base = mode === 'dare' ? DICE_DARE : DICE_TRUTH;
  return base.concat(diceMine().filter(x => x.m === mode).map(x => [x.t, x.l, true]));

function diceLevel(){ if (!S.diceLv){ try { S.diceLv = localStorage.getItem('od_dice_lv') || '2'; } catch { S.diceLv = '2'; } } return +S.diceLv; }
function dicePick(list){
  const lv = diceLevel();
  const pool = [];
  list.forEach(([t, l, mine]) => { if (l <= lv && (lv < 4 || l >= 3 || mine)) for (let i = 0; i < (mine || l === lv ? 3 : 1); i++) pool.push(t); });
  if (!S.diceLast) S.diceLast = new Map();
  const key = list.mode || list;
  let t;
  for (let i = 0; i < 6; i++){ t = pool[Math.floor(Math.random() * pool.length)]; if (t !== S.diceLast.get(key)) break; }
  return t;
}
function diceTurn(){ if (!S.diceTurn) S.diceTurn = S.me; return S.diceTurn; }

  const name = h('input', {type: 'text', id: 'pN', maxlength: '20', placeholder: '比如：鼓浪屿'});
  const date = h('input', {type: 'date', id: 'pD'});
  const note = h('textarea', {class: 'bigta', id: 'pT', maxlength: '120', placeholder: '那天发生了什么？（选填）', style: {minHeight: '90px'}});
  if (cur){ city.value = cur.city; name.value = cur.name || ''; date.value = cur.date || ''; note.value = cur.note || ''; }
  openSheet(cur ? '修改这个地方' : '记下一个地方', h('div', null,
    h('div', {class: 'group'},
      h('label', {class: 'field'}, h('span', {text: '城市'}), city),
      h('label', {class: 'field'}, h('span', {text: '地方'}), name),
      h('label', {class: 'field'}, h('span', {text: '日期'}), date)),
    note,
    h('div', {class: 'actions'},
      h('button', {class: 'btn block', text: cur ? '保存' : '盖个章', onclick: () => {
        if (!city.value.trim()){ toast('城市要填哦'); return; }
        Store.put(cur ? cur.id : 'p_' + uid(), 'place', {city: city.value.trim(), name: name.value.trim(), date: date.value, note: note.value.trim(), by: S.me, at: cur ? cur.at : Date.now()});
        closeSheet(); toast(cur ? '改好了' : '盖章成功'); haptic();
      }}),
      cur ? h('button', {class: 'btn block ghost danger', text: '删除', onclick: () => confirmSheet('删除「' + cur.city + (cur.name ? ' · ' + cur.name : '') + '」？', '删除', () => { Store.remove(cur.id); toast('删掉了'); })}) : null)));
}

/* =============== us: TA 的说明书 / 留言 =============== */
const MANUAL = [['food', '爱吃的'], ['nofood', '不吃的 / 过敏的'], ['drink', '奶茶、咖啡怎么点'], ['size', '尺码（衣服、鞋、戒指）'], ['like', '喜欢的花、颜色、牌子'], ['wish', '最近想要的东西'], ['mine', '雷区：千万别做的事'], ['coax', '不开心的时候怎么哄'], ['other', '其他要记住的']];
function usPage(){
  const p = h('div', {class: 'page'});
  if (!S.usSeg) S.usSeg = 'manual';
  pageHead(p, '我们', S.usSeg === 'manual' ? '记下对方的喜好和雷区' : '写给彼此的小便签', [['manual', '说明书'], ['notes', '留言', unreadNotes() > 0]], 'usSeg');
  if (S.usSeg === 'manual') manualView(p); else { notesView(p); seenLater('notes'); }
  return p;
}
function manualView(p){
  if (!S.manualWho) S.manualWho = other(S.me);
  const who = S.manualWho;
  p.append(h('div', {class: 'mwho', role: 'group'}, ['A', 'B'].map(k => h('button', {'aria-pressed': String(who === k), onclick: () => { S.manualWho = k; render(); }}, avatar(k), h('span', {text: nameOf(k) + ' 的说明书'})))));
  const filled = MANUAL.filter(([k]) => (Store.get('m_' + who + '_' + k) || {}).text).length;
  const list = h('div', {class: 'card mlist'});
  MANUAL.forEach(([k, label]) => {
    const it = Store.get('m_' + who + '_' + k);
    list.append(h('button', {class: 'mrow', onclick: () => manualSheet(who, k, label)},
      h('div', {class: 'k'}, h('span', {text: label}), it && it.text ? h('span', {style: {fontWeight: 500}, text: nameOf(it.by) + ' 记的'}) : null),
      h('div', {class: 'v' + (it && it.text ? '' : ' dim'), text: it && it.text ? it.text : (who === S.me ? '告诉 TA：点这里写' : '还不知道？点这里记下来')})));
  });
  p.append(list);
  p.append(h('p', {class: 'hint', style: {textAlign: 'center', marginTop: '16px'}, text: filled + ' / ' + MANUAL.length + ' 项已记下 · 两个人都可以补充和修改'}));
}
function manualSheet(who, k, label){
  const it = Store.get('m_' + who + '_' + k);
  const ta = h('textarea', {class: 'bigta', id: 'mT', maxlength: '300', style: {minHeight: '140px'}, placeholder: '写下来，买礼物、点外卖的时候就不用猜了'});
  if (it) ta.value = it.text || '';
  openSheet(nameOf(who) + ' · ' + label, h('div', null, ta, h('button', {class: 'btn block', text: '保存', onclick: () => {
    const text = ta.value.trim();
    if (text) Store.put('m_' + who + '_' + k, 'manual', {who, key: k, text, by: S.me, at: Date.now()});
    else if (it) Store.remove('m_' + who + '_' + k);
    closeSheet(); toast('记下了');
  }})));
}

/* =============== settings =============== */
function settingsSheet(){
  const i = info();
  const f = (id, type, val, ph) => { const e = h('input', {type, id, placeholder: ph || ''}); if (val) e.value = val; if (type === 'text') e.maxLength = 12; return e; };
  const nA = f('sA', 'text', i.nameA), nB = f('sB', 'text', i.nameB), sd = f('sS', 'date', i.start), bA = f('sBA', 'date', i.birthA), bB = f('sBB', 'date', i.birthB);
  const photoRow = (label, k) => h('button', {class: 'field btnrow', onclick: () => k === 'cover' ? setCover().then(settingsSheet) : setAvatar(k).then(settingsSheet)},
    h('span', {text: label}), h('span', {class: 'val'}, k === 'cover' ? h('span', {text: photo('cover') ? '已设置' : '未设置'}) : avatar(k), h('span', {html: I.chev, class: 'chev', style: {display: 'contents'}})));
  const body = h('div', null,
    h('div', {style: {fontSize: '12px', color: 'var(--muted)', fontWeight: 600, margin: '0 4px 6px'}, text: '我们'}),
    h('div', {class: 'group'},
      h('label', {class: 'field'}, h('span', {text: '名字 1'}), nA),
      h('label', {class: 'field'}, h('span', {text: '名字 2'}), nB),
      h('label', {class: 'field'}, h('span', {text: '在一起的日子'}), sd),
      h('label', {class: 'field'}, h('span', {text: (i.nameA || '1') + ' 的生日'}), bA),
      h('label', {class: 'field'}, h('span', {text: (i.nameB || '2') + ' 的生日'}), bB)),
    h('button', {class: 'btn block', style: {marginBottom: '22px'}, text: '保存', onclick: () => {
      if (!nA.value.trim() || !nB.value.trim() || !sd.value){ toast('名字和在一起的日子要填'); return; }
      Store.put('info', 'info', {nameA: nA.value.trim(), nameB: nB.value.trim(), start: sd.value, birthA: bA.value || '', birthB: bB.value || ''});
      closeSheet(); toast('保存好了');
    }}),
    h('div', {style: {fontSize: '12px', color: 'var(--muted)', fontWeight: 600, margin: '0 4px 6px'}, text: '照片'}),
    h('div', {class: 'group'}, photoRow('首页合照', 'cover'), photoRow(nameOf('A') + ' 的头像', 'A'), photoRow(nameOf('B') + ' 的头像', 'B')),
    h('div', {style: {fontSize: '12px', color: 'var(--muted)', fontWeight: 600, margin: '0 4px 6px'}, text: '这台手机是谁的'}),
    h('div', {class: 'who2'}, ['A', 'B'].map(k => h('button', {'aria-pressed': String(S.me === k), onclick: () => { S.me = k; lsSet('od-me', k); writeUrl(); closeSheet(); render(); toast('现在是 ' + nameOf(k)); }}, avatar(k), nameOf(k)))),
    h('div', {style: {fontSize: '12px', color: 'var(--muted)', fontWeight: 600, margin: '0 4px 6px'}, text: '邀请 ' + nameOf(other(S.me))}),
    inviteBlock());
  openSheet('设置', body);
}
function inviteBlock(){
  if (!REMOTE) return h('p', {class: 'hint', text: '同步功能还没开通。开通后这里会出现一个邀请链接，发给对方，两个人就能看到同一份内容。'});
  const link = inviteLink();
  const copy = async (txt, ok) => { try { await navigator.clipboard.writeText(txt); toast(ok); } catch { toast('长按上面的文字也能复制'); } };
  const share = async () => { if (navigator.share){ try { await navigator.share({title: '我们的小日子', text: '点开这个链接，加入我们的小日子：', url: link}); } catch {} } else copy(link, '链接已复制，发给 TA 吧'); };
  return h('div', null,
    h('div', {class: 'codebox', text: fmtCode(S.room)}),
    h('p', {class: 'hint', text: '把邀请链接发给 ' + nameOf(other(S.me)) + '，TA 点开就能进来，不用注册。也可以在开始页选“我有邀请码”，输入上面这串暗号。别把它发给别人哦。'}),
    h('div', {class: 'actions'},
      h('button', {class: 'btn block', onclick: share}, '发送邀请链接'),
      h('button', {class: 'btn block ghost', onclick: () => copy(fmtCode(S.room), '暗号已复制')}, '复制暗号')));
}

/* =============== onboarding =============== */
function feat(ic, tone, text){ return h('div', null, h('span', {class: 'dic ' + tone, html: I[ic]}), h('span', {text})); }
function welcomePage(){
  $('#tabbar').hidden = true;
  const root = $('#root'); root.textContent = '';
  root.append(h('div', {class: 'ob'},
    h('div', {class: 'art'},
      h('img', {class: 'logo', src: 'icons/icon-512.png', alt: ''}),
      h('h1', {text: '我们的小日子'}),
      h('p', {class: 'lead', text: '只属于你们两个人的小本子'}),
      h('div', {class: 'feat'},
        feat('mail', 'rose', '提前写好的信，TA 累了委屈了就能拆开'),
        feat('rings', 'gold', '在一起的天数、纪念日和生日'),
        feat('book', 'mint', 'TA 的说明书、爱的小券、一起去过的地方'))),
    h('div', {class: 'actions'},
      h('button', {class: 'btn block', text: '创建我们的空间', onclick: createPage}),
      h('button', {class: 'btn block ghost', text: '我有邀请码', onclick: joinPage}))));
}
function createPage(){
  const root = $('#root'); root.textContent = '';
  const f = (id, type, ph) => { const e = h('input', {type, id, placeholder: ph || ''}); if (type === 'text') e.maxLength = 12; return e; };
  const nA = f('cA', 'text', '比如：小鱼'), nB = f('cB', 'text', '比如：阿星'), sd = f('cS', 'date'), bA = f('cBA', 'date'), bB = f('cBB', 'date');
  root.append(h('div', {class: 'ob'},
    h('button', {class: 'back', onclick: welcomePage}, h('span', {html: I.back, style: {display: 'contents'}}), '返回'),
    h('h2', {text: '先认识一下你们'}),
    h('p', {class: 'hint', style: {marginTop: 0}, text: '填好就能开始数天数。以后都能在设置里改。'}),
    h('div', {class: 'group'},
      h('label', {class: 'field'}, h('span', {text: '你的名字'}), nA),
      h('label', {class: 'field'}, h('span', {text: 'TA 的名字'}), nB),
      h('label', {class: 'field'}, h('span', {text: '在一起的日子'}), sd)),
    h('div', {class: 'group'},
      h('label', {class: 'field'}, h('span', {text: '你的生日'}), bA),
      h('label', {class: 'field'}, h('span', {text: 'TA 的生日'}), bB)),
    h('p', {class: 'hint', style: {marginTop: '-6px'}, text: '生日可以先不填'}),
    h('div', {style: {flex: 1}}),
    h('button', {class: 'btn block', text: '开始我们的小日子', onclick: () => {
      if (!nA.value.trim() || !nB.value.trim() || !sd.value){ toast('名字和在一起的日子要填哦'); return; }
      const room = secret();
      S.tab = 'home';
      Store.open(room);
      Store.put('info', 'info', {nameA: nA.value.trim(), nameB: nB.value.trim(), start: sd.value, birthA: bA.value || '', birthB: bB.value || ''});
      enterRoom(room, 'A');
      if (REMOTE) setTimeout(() => { settingsSheet(); setTimeout(() => { const s = $('#sheet'); s.scrollTop = s.scrollHeight; }, 350); toast('把邀请链接发给 ' + nameOf('B')); }, 700);
    }})));
}
function joinPage(prefill){
  const root = $('#root'); root.textContent = '';
  const inp = h('input', {class: 'input', id: 'joinCode', type: 'text', placeholder: 'xxxx-xxxx-xxxx-xxxx-xxxx-xxxx', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false', style: {fontFamily: 'ui-monospace,Menlo,monospace', textAlign: 'center'}});
  if (prefill) inp.value = fmtCode(prefill);
  const btn = h('button', {class: 'btn block', text: '加入', onclick: async () => {
    const code = cleanCode(inp.value);
    if (code.length < 20){ toast('暗号不完整，再检查一下'); return; }
    if (!REMOTE){ toast('同步还没开通，暂时不能加入'); return; }
    btn.disabled = true; btn.textContent = '正在加入…';
    Store.open(code); const ok = await Store.pull();
    btn.disabled = false; btn.textContent = '加入';
    if (!ok){ toast('连不上网，稍后再试'); return; }
    if (!Store.get('info')){ toast('没找到这个空间，暗号可能不对'); return; }
    S.room = code; lsSet('od-room', code); S.me = null; writeUrl(); Store.start(); render();
  }});
  root.append(h('div', {class: 'ob'},
    h('button', {class: 'back', onclick: welcomePage}, h('span', {html: I.back, style: {display: 'contents'}}), '返回'),
    h('h2', {text: '输入邀请暗号'}),
    h('p', {class: 'hint', style: {marginTop: 0}, text: '在对方手机的「设置 → 邀请」里能看到，一共 24 个字母和数字。直接点对方发来的邀请链接会更省事。'}),
    inp, h('div', {style: {flex: 1, minHeight: '24px'}}), btn));
}
function pickWhoPage(){
  const p = h('div', {class: 'ob'},
    h('div', {class: 'art'},
      h('div', {class: 'pair', style: {transform: 'scale(1.6)', marginBottom: '18px'}}, avatar('A'), avatar('B')),
      h('h2', {text: '欢迎来到你们的小日子'}),
      h('p', {class: 'lead', text: '这台手机是谁的？'}),
      h('div', {class: 'who2', style: {width: '100%', maxWidth: '340px'}},
        ['A', 'B'].map(k => h('button', {onclick: () => { S.me = k; lsSet('od-me', k); writeUrl(); haptic(); render(); toast('你好，' + nameOf(k)); }}, avatar(k), nameOf(k))))));
  return p;
}
function waitingPage(){
  return h('div', {class: 'ob'}, h('div', {class: 'art'}, h('img', {class: 'logo', src: 'icons/icon-512.png', alt: ''}), h('p', {class: 'lead', text: '正在打开你们的小日子…'}), syncLine()));
}

/* =============== boot =============== */
(function boot(){
  inAppBanner();
  const u = readUrl();
  const savedRoom = lsGet('od-room', null);
  const room = u.room || savedRoom;
  if (room && room.length >= 20){
    S.room = room;
    S.me = (u.me === 'A' || u.me === 'B') ? u.me : (room === savedRoom ? lsGet('od-me', null) : null);
    lsSet('od-room', room); if (S.me) lsSet('od-me', S.me);
    Store.open(room); writeUrl(); Store.start(); render();
  } else welcomePage();
  setInterval(() => { if (S.room && !$('#sheet').classList.contains('show') && !document.hidden && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') render(); }, 60 * 60 * 1000);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
