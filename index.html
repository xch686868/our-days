/* ---------- 卡片里的倒计时：内容里写了几秒 / 几分钟，就给一个计时按钮 ---------- */
// 限制级卡的「总时长」：只认整张卡一共多久。按次数 / 按轮来的、分好几段的（吸 30 秒再咬 30 秒）、加时的，都不算总时长
function totSpan(t){
  const c = String(t).replace(/最多加到 ?\d+ ?(秒|分钟)/g, m => '#'.repeat(m.length)).replace(/(多|加|再)[^，；、]{0,4}?\d+ ?(秒|分钟)/g, m => '#'.repeat(m.length))
    .replace(/每 ?\d+ ?(秒|分钟)/g, m => '#'.repeat(m.length));
  const mins = [...c.matchAll(/(\d+) ?分钟/g)], secs = [...c.matchAll(/(\d+) ?秒/g)];
  const after = m => c.slice(m.index + m[0].length);
  if (mins.length === 1 && !/来回|轮|换边|换另一边|每边/.test(after(mins[0]))) return {sec: +mins[0][1] * 60, at: mins[0].index, len: mins[0][0].length};
  const clause = m => c.slice(0, m.index).split(/[，；]/).pop();  // 同一句前面有「每 / 换成 / 停」，说明是一小段
  if (!mins.length && secs.length === 1 && !/来回|轮|各|换边|换另一边|每边|两边/.test(after(secs[0])) && !/每|换成|停/.test(clause(secs[0]))) return {sec: +secs[0][1], at: secs[0].index, len: secs[0][0].length};
  return null;
}
// 限制级挑战卡：总时长由计时器随机定，卡上的总时长去掉，免得卡上写的和点进去的不一样
function noTot(t){
  const m = totSpan(t); if (!m) return t;
  let x = t.slice(0, m.at) + '§' + t.slice(m.at + m.len);
  x = x.replace(/ ?§就停/, '到时间就停').replace(/，([含舔撸磨贴])\s*§$/, '，一直$1').replace(/到最高档贴 ?§/, '到最高档一直贴着').replace(/在 ?§ ?里/, '').replace(/接下来 ?§/, '接下来').replace(/§ ?里/, '').replace(/坚持 ?§/, '坚持住')
    .replace(/([一-龥]{1,2})满 ?§/, (a, v) => v === '快速撸' || v === '速撸' ? '一直快速撸' : '一直' + v.replace(/^[撸舔扯咬转绕磨含]?/, w => w))
    .replace(/[，,]? ?满 ?§/, '').replace(/来回 ?§/, '来回轮着').replace(/[，,]? ?§换一边/, '，一会儿换一边').replace(/ ?§ ?/, '');
  return x.replace(/，，/g, '，').replace(/^，/, '').replace(/\s+([，。；）])/g, '$1').replace(/([）])\s+/g, '$1');
}
function totSecs(t){ const m = totSpan(t); return m ? m.sec : 0; }
function cdSecs(t){
  const m = String(t).replace(/每 ?\d+\s*(秒|分钟)/g, '').match(/(\d+)\s*(秒|分钟)|([一两三四五])分钟|数到 ?(\d+)/);
  if (!m) return 0;
  if (m[1]) return +m[1] * (m[2] === '分钟' ? 60 : 1);
  if (m[3]) return ('一两三四五'.indexOf(m[3]) + 1) * 60;
  return +m[4];
}
// 倒计时结束「滴滴滴」：第一次点屏幕时先把声音解锁（iPhone 要求）
let AC = null;
const audio = () => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state !== 'running') AC.resume(); } catch {} return AC; };
['pointerdown', 'touchend'].forEach(e => document.addEventListener(e, audio, {passive: true}));
function beep(){
  const a = audio();
  if (a) try { const t0 = a.currentTime + 0.05; [0, 0.35, 0.7].forEach(d => { const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = 1050;
    g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.5, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.22);
    o.connect(g); g.connect(a.destination); o.start(t0 + d); o.stop(t0 + d + 0.25); }); } catch {}
  try { navigator.vibrate && navigator.vibrate([200, 120, 200, 120, 200]); } catch {}
}
// 时间到：一直滴滴滴，直到点一下屏幕（这一下只用来停响，不会点到按钮）
let RING = null;
function ring(){ stopRing(); beep(); RING = setInterval(beep, 1600);
  const d = document.createElement('div'); d.id = 'ringBar'; d.textContent = '⏰ 时间到！点一下屏幕停止响铃';
  d.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:9999;padding:14px;border-radius:14px;background:#e5484d;color:#fff;font-weight:700;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)';
  document.body.append(d); }
function stopRing(){ if (RING){ clearInterval(RING); RING = null; } const d = document.getElementById('ringBar'); if (d) d.remove(); try { navigator.vibrate && navigator.vibrate(0); } catch {} }
document.addEventListener('click', e => { if (RING){ stopRing(); e.stopPropagation(); e.preventDefault(); } }, true);
// 卡上写的「多 / 加 N 秒」，没写就 0
const CNUM = {'五': 5, '十': 10, '二十': 20, '三十': 30, '一': 1, '两': 2};
function addStep(t){ const m = String(t || '').replace(/最多加到 ?\d+ ?(秒|分钟)/g, '').match(/(?:多|加)[^，；、。]{0,4}?(\d+|三十|二十|十|五|一|两) ?(秒|分钟)/); return m ? (+m[1] || CNUM[m[1]] || 0) * (m[2] === '分钟' ? 60 : 1) : 0; }
const ADD_MAX = Infinity;  // 不听话就一直加，不设上限
function cdBtn(t, force, max){
  const sec = force == null ? cdSecs(t) : force; if (!sec) return null;
  let ab = null;
  const fmt = n => n >= 60 ? Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0') : n + ' 秒';
  const label = () => {
    const c = S.cd && S.cd.key === t ? S.cd : null;
    if (!c) return '⏱ 开始计时 ' + fmt(sec);
    const left = Math.max(0, Math.ceil((c.end - Date.now()) / 1000));
    return left > 0 ? '⏱ 还剩 ' + fmt(left) + '（点一下停）' : '⏰ 时间到！点一下再来';
  };
  const b = h('button', {class: 'btn block dcd', 'data-cd': '1', onclick: () => {
    const c = S.cd && S.cd.key === t ? S.cd : null;
    if (c && c.end > Date.now()) S.cd = null; else { S.cd = {key: t, end: Date.now() + sec * 1000, done: false, add: 0}; cdTick(); }
    haptic(); b.textContent = label(); if (ab) ab._label();
  }});
  b._label = label; b.textContent = label();
  const step = addStep(t) || 30;
  const room = () => (max || ADD_MAX) - sec - ((S.cd && S.cd.key === t && S.cd.add) || 0);
  ab = h('button', {class: 'btn block dadd', 'data-cd': '1', onclick: () => {
    const c = S.cd && S.cd.key === t ? S.cd : null;
    if (!c || c.end <= Date.now() || room() <= 0) return;
    const n = Math.min(step, room()); c.add = (c.add || 0) + n; c.end += n * 1000; haptic(); ab._label(); b.textContent = label();
  }});
  ab._label = () => { const c = S.cd && S.cd.key === t ? S.cd : null, on = !!c && c.end > Date.now();
    ab.hidden = !on; ab.disabled = room() <= 0;
    ab.textContent = !on ? '➕ 不听话加时（开始计时后能点）' : room() <= 0 ? '已经加满 30 分钟' : '➕ 不听话 +' + Math.min(step, room()) + ' 秒' + (c.add ? '（已加 ' + c.add + ' 秒）' : ''); };
  ab._label();
  return h('div', {class: 'cdwrap'}, b, ab);
}
function cdTick(){
  clearInterval(S.cdTimer);
  S.cdTimer = setInterval(() => {
    const c = S.cd;
    document.querySelectorAll('[data-cd]').forEach(b => { if (b._label){ const v = b._label(); if (typeof v === 'string') b.textContent = v; } });
    if (!c){ clearInterval(S.cdTimer); return; }
    if (!c.done && Date.now() >= c.end){ c.done = true; clearInterval(S.cdTimer); ring(); document.querySelectorAll('[data-cd]').forEach(b => { if (b._label){ const v = b._label(); if (typeof v === 'string') b.textContent = v; } }); }
  }, 250);
}

  [{m: '{w}一边用力拧你的乳头，一边用丝袜裹着指尖在你的龟头上来回拉 3 分钟，每被弄一下你都要「汪」一声，你不许躲', f: '{w}一边轻轻捏你的乳头，一边把玩具开最高档压着你 1 分钟，你不许躲'}, 4], [{m: '{w}咬住你的乳头不松口，手里快速撸你，寸止五次才松口，你每求饶一次就多寸止一次，求饶只许说「小狗不敢了」', f: '{w}咬住你的乳头不松口，玩具贴着你，寸止三次才松口'}, 4], [{m: '{w}只撸你的龟头，撸二十下掐一次乳头，掐满二十次，中间你要一直「汪」', f: '{w}用玩具只碰你的阴蒂，碰二十下轻轻捏一次乳头，轻轻捏满十次'}, 4],
  [{m: '{w}让你趴好（膝盖和手肘撑床、屁股翘高）「汪」二十声，叫得不响就重来，然后一边打你屁股 50 下，一边从后面撸你，快射了就停下用掌心磨你的龟头十下', f: '{w}轻轻咬你的乳头 30 秒，你越躲他咬得越久'}, 4], [{m: '{w}一边摸你的头一边快速撸你 3 分钟，你要一直说「小狗错了」，快射时她换成磨龟头，你不许射', f: '{w}用手指捏着你的乳头慢慢转 30 秒，你推开他就多转 10 秒'}, 4], [{m: '{w}让你叼住她的手指，她用另一只手掐你的乳头、撸你 2 分钟，你松口就从头再来，每撸一会儿就停下磨你的龟头，你只许叼着手指「呜呜」哼', f: '{w}含住你的乳头轻轻吸 30 秒，再换另一边，你躲一下就多吸 10 秒'}, 4], [{m: '你趴好（两个膝盖和两只手肘撑床、屁股翘高），{w}用丝袜在你蛋蛋上系个活结，从后面攥着，从两腿中间撸你寸止三次；你往前躲一下她就往后拽一下', f: '{w}一边轻轻捏你的乳头，一边用舌尖舔你的阴蒂 1 分钟，你并腿就多加 10 秒'}, 4], [{m: '{w}用掌心磨你的龟头 2 分钟，你每「呜」一声就多磨 20 秒，你往回缩一下她就拍一下你的蛋蛋，你不许射', f: '你像母狗一样趴好翘起屁股，{w}用玩具贴着你的阴蒂 1 分钟，你要叫着「爸爸」数秒'}, 4], [{m: '{w}让你双手背后跪好，轮流咬你两边乳头 20 次，同时撸你，你躲一次就多咬 5 次；撸到快射就停，等你缓过来再撸，寸止你两次，你要一直「汪汪」求主人饶了小狗', f: '{w}轻轻捏你的两边乳头，数到 20，你越扭他捏得越久'}, 4],
  [{m: '你被绑着蒙上眼，{w}用掌心包住你的龟头转着磨 1 分钟，你只许「汪」，不许躲、不许射', f: '你被绑着蒙上眼，{w}把玩具开最高档压在你的阴蒂上 1 分钟，你不许躲'}, 4], [{m: '{w}用抹了润滑的丝袜或湿毛巾包住你的龟头来回磨，磨到你「汪汪」求饶三次才停', f: '{w}用整片舌头贴着你的阴蒂来回慢慢磨，磨到你求饶三次才停'}, 4], [{m: '{w}握紧你的根部不让你射，另一只手只揉你的龟头 1 分钟，你要一直说「小狗错了」', f: '{w}按住你的腿，用舌尖只舔你的阴蒂 1 分钟，你要一直说「我错了」'}, 4], [{m: '{w}舔湿指尖，刮你的系带十下就停五秒，来回 2 分钟，停的时候你要「汪」着谢谢主人', f: '{w}用玩具贴你十秒就停五秒，来回 2 分钟，停的时候你要说谢谢'}, 4],
  [{m: '{w}把你绑在床上，用嘴含着你快速吞吐（或用手快速撸）2 分钟，快射了也不停，你只能靠自己忍住，每被弄十下你都要「汪」着说「谢谢主人」', f: '{w}把你绑在床上，用玩具开最高档贴着你的阴蒂 2 分钟，快到了也不拿开，你只能靠自己忍住'}, 4], [{m: '你趴好（膝盖和手肘撑床、屁股翘高），{w}一边打你的屁股一边从后面快速撸你，打满 60 下，每下你都要「汪」着报数，快射了就停下用指尖刮你的系带十下', f: '你跪趴好翘起屁股，{w}一边轻轻拍你的屁股一边从后面用玩具贴着你，拍满 10 下，每下报数'}, 4], [{m: '{w}含住你的龟头慢慢吸，舌尖绕着冠状沟打转（或用指尖绕着打转）2 分钟，求饶只许说「主人饶了小狗」，你不许躲、不许挺腰', f: '{w}按住你的腿，舌尖快速舔你的阴蒂 2 分钟，越舔越快，你不许躲、不许并腿'}, 4], [{m: '{w}咬住你的乳头往外扯，另一只手快速撸你 1 分钟，你「汪汪」求饶她就咬得更用力，每撸十下就停下磨你的龟头三下', f: '{w}含住你的乳头用舌头一直舔，另一只手拿玩具贴着你 1 分钟，你喊停一次他就把玩具调高一档'}, 4], [{m: '{w}在 3 分钟里寸止你五次，每次停下都打你屁股五下，你要「汪」着说「谢谢主人」', f: '{w}在 3 分钟里寸止你五次，每次拿开都打你屁股五下，你要说「谢谢你」'}, 4], [{m: '你双手绑在身后跪着，{w}用丝袜抹上润滑包住你的龟头来回磨 1 分钟，你倒下一次就多磨 20 秒，你要一边「汪」一边舔主人的手指求饶', f: '你双手绑在身后跪着分开腿，{w}用玩具贴着你 1 分钟，你倒下一次就多加 20 秒'}, 4], [{m: '{w}蒙上你的眼睛，一下撸你、一下拧你的乳头、一下打你屁股，2 分钟里你猜不到下一下，撸到快射就停，寸止你两次再继续，你要像小狗一样伸着舌头喘着受着，不许出声', f: '{w}蒙上你的眼睛，一下舔你、一下捏你的乳头、一下轻轻拍你屁股，2 分钟里你猜不到下一下，不许出声'}, 4], [{m: '{w}一边拿跳蛋点你的马眼，一边让你说「我是主人的小狗」，说一句点一下，说满十五句', f: '{w}一边用玩具压着你的阴蒂，一边让你说「我是你的母狗」，说一句多压十秒，说满十句'}, 4], [{m: '{w}握紧你的根部，用舌头舔（或用指尖揉）你的龟头和系带 2 分钟，你只许「汪汪」，不许说人话', f: '{w}用手指掰开你，只用舌尖舔你的阴蒂 2 分钟，你只许叫他「爸爸」'}, 4], [{m: '你自己撸给{w}看，撸到快射就要停，停下她打你屁股三下再继续，来回五次，你要一直「汪汪」求主人饶了小狗', f: '你自己用玩具弄给{w}看，快到就要拿开，拿开他打你屁股三下再继续，来回五次'}, 4],
  [{m: '{w}握紧你的根部，用指甲轻轻刮你的系带和冠状沟 3 分钟，你每「汪」着求饶一次就多刮 20 秒，你不许射', f: '{w}按住你的腿，把玩具开最高档压着你的阴蒂 2 分钟，你每求饶一次就多压 10 秒，最多加到 4 分钟，你不许到'}, 4],
  [{m: '你趴好（膝盖和手肘撑床、屁股翘高），{w}从后面一边撸你一边打屁股，打满 60 下，你每倒下一次她就多打十下，快射了就停下用掌心磨你的龟头十下，求饶只许「汪汪汪」叫三声，不许射', f: '你跪趴着翘起屁股，{w}从后面用玩具贴着你，一边轻轻拍你屁股，拍满 10 下，你每躲一次他就多拍两下'}, 4],
  [{m: '{w}把你的手脚绑住，寸止你八次，每次停下都捏住你的龟头揉十下，你要「汪」着说「谢谢主人」', f: '{w}把你的手绑住，用玩具寸止你五次，每次拿开都咬你的乳头一下，你要说「谢谢爸爸」'}, 4],
  [{m: '{w}用抹了润滑的丝袜包住你的龟头，一边拧你的乳头一边磨 3 分钟，你只许「汪」，不许射', f: '{w}一边咬你的乳头，一边用舌头和玩具轮流弄你的阴蒂 2 分钟，你只许叫「爸爸」，不许到'}, 4],
  [{m: '你仰躺露出肚子，{w}坐在你身上，两只手交替快速撸你 3 分钟，快射了她就换成只磨龟头，你要「汪」着说「主人再多玩玩小狗」，你不许射、不许推开', f: '你仰躺张开腿，{w}跪在你腿间，用舌头快速舔你的阴蒂 2 分钟，快到了他就停下咬你的大腿内侧，你不许到'}, 4],
  [{m: '{w}蒙上你的眼睛，随机撸你、磨龟头、掐乳头、打屁股，一共 20 下，你每下都要猜对是哪一样，猜错一次她就磨你的龟头十下，你要「汪」着说「谢谢主人玩小狗」', f: '{w}蒙上你的眼睛，随机舔你、用玩具贴你、咬乳头、打屁股，一共 15 下，你每下都要猜对，猜错一次他就咬你的乳头一口'}, 4],
  [{m: '你自己撸给{w}看，她坐在旁边掐着你的乳头，你要寸止自己六次，每次停下都要「汪」着报告，不许射', f: '你自己用玩具弄给{w}看，他坐在旁边捏着你的乳头，你要停下来五次不许到，每次停下都要叫「爸爸」报告'}, 4],
  [{m: '{w}含住你的龟头只吸不动（或用掌心包住只揉龟头）2 分钟，你要挺着胸受着，你不许挺腰，挺一下她就咬你的乳头一口', f: '{w}含住你的阴蒂只吸不动 2 分钟，你不许挺腰，挺一下他就咬你的乳头一口'}, 4],
  [{m: '{w}一只手轻轻拍打你的蛋蛋，另一只手只磨你的龟头 3 分钟，你每缩一下就多磨 30 秒，你只许「汪」和喘，不许射', f: '{w}一只手轻轻捏着你的乳头往外拉，另一只手拿玩具贴着阴蒂 2 分钟，你只许叫「爸爸」，不许到'}, 4],
  [{m: '你双手背在身后跪直，{w}一边用掌心拍你的龟头一边说「坏小狗」，拍满 40 下，你每下都要「汪」着报数', f: '你双手背在身后跪直，{w}一边用手掌拍你的阴唇一边说「坏母狗」，拍满 20 下，你每下都要报数'}, 4],
  [{m: '{w}用口水把你弄湿，两根手指圈住你的冠状沟快速转 3 分钟，你每缩一下就多转 20 秒，你每求一次饶都要说「小狗错了」，不许射', f: '{w}只用舌尖快速舔你的阴蒂 2 分钟，你每缩一下就多舔 10 秒，最多加到 4 分钟，不许到'}, 4],
  [{m: '{w}把你撸到快射就停，停下来用指甲刮你的龟头，来回六次，你每次都要「汪」着求她继续', f: '{w}用玩具把你弄到快到就拿开，拿开时用舌尖舔你的阴蒂，来回五次，你每次都要叫「爸爸」求他继续'}, 4],
  [{m: '你被绑着蒙上眼，{w}一边咬你的乳头一边用抹了润滑的丝袜撸你 3 分钟，你求饶一次她就换一边乳头咬，每撸一会儿就停下磨你的龟头，你每被弄一下都要说「谢谢主人」，不许射', f: '你被绑着蒙上眼，{w}一边咬你的乳头一边用玩具开高档贴着你 2 分钟，你求饶一次他就换一边乳头咬，不许到'}, 4],
  [{m: '{w}让你叼住项圈，一只手拽着项圈一只手撸你 3 分钟，你松口一次就打十下屁股，撸到快射就停，寸止你三次再继续，你只许叼着项圈「呜呜」哼，不许射', f: '{w}让你叼住衣角，一只手抓着你的头发一只手用玩具弄你 2 分钟，你松口一次就打五下屁股，不许到'}, 4],
  [{m: '你戴着项圈跪直、双手背在身后，{w}分三轮玩你：第一轮用掌心磨你的龟头 1 分钟，第二轮一边拍打你的蛋蛋一边撸 1 分钟，第三轮含住你用力吸（或用手握紧快速撸）1 分钟，三轮轮完再来一遍，每轮开始你都要「汪」着报第几轮，你不许倒下、不许射'}, 4],
  [{m: '你仰躺把腿抱起来露出下面，{w}一只手用掌心磨你的龟头，一只手轻轻拍打你的蛋蛋，一共 5 分钟，每过 30 秒你都要自己说一句「小狗的鸡巴是主人的」，漏一句就多 30 秒，你不许合腿、不许射'}, 4],
  [{m: '{w}拽着你的项圈让你跪在她面前，你先舔她的脚趾和脚背 2 分钟，再舔她的手心和手指 2 分钟，她另一只手一直撸你、磨你的龟头，你舔慢了或停了她就拍一下你的蛋蛋、从头计时，你不许射'}, 4],
  [{m: '{w}把你的手绑在身后，让你跪着挺起下面，她一边舔你的乳头一边用掌心磨你的龟头，每磨十下就停下拍打一下你的蛋蛋，一共 4 分钟，你要「汪」着数她拍了几下，数错就从头数，你不许射'}, 4],
  [{m: '你趴在{w}腿上撅着屁股，她一边打你的屁股一边从下面撸你，打一下撸三下，打满 40 下以后让你翻过来，再只磨你的龟头 2 分钟，你倒下一次就多打十下，你要一直「汪汪」求主人饶了小狗，你不许射'}, 4],
  [{m: '{w}给你戴上项圈，用丝袜在你蛋蛋上系个活结，让你仰躺露出肚子，坐在你腿上撸到快射就停、刮你的系带，5 分钟寸止你五次；你每躲一下她就拽一下，你不许射'}, 4],
  [{m: '{w}蒙上你的眼睛、绑住你的手，5 分钟里随机轮着来：含住你吸（或用手握紧撸）、用掌心磨龟头、拍打蛋蛋、拧乳头，每一下之前你都要「汪」着猜是哪一种，猜错一次就多 10 秒，你不许射'}, 4],
  [{m: '你跪好把腿分到最开，{w}用抹了润滑的丝袜包住你的龟头来回磨，你要自己捏着两边乳头往外拉，一共 4 分钟，手松一下她就拍一下你的蛋蛋，你只许「呜呜」哼，你不许射'}, 4],

function punTick(){
  clearInterval(S.punTimer);
  S.punTimer = setInterval(() => {
    const P = S.pun;
    if (!P || P.stage !== 'run'){ clearInterval(S.punTimer); return; }
    const left = Math.max(0, Math.ceil((P.end - Date.now()) / 1000));
    const el = document.getElementById('punLeft'); if (el) el.textContent = String(left);
    if (left <= 0){
      clearInterval(S.punTimer); P.stage = 'ok'; ring();
      if (S.tab === 'together' && S.togetherSeg === 'dice' && !S.busy) render();
    }
  }, 250);
}

function scratchCard(card){
  const tier = card ? card.tier : null;
  const box = h('div', {class: 'scard' + (tier === 0 ? ' t1' : '')});
  const prize = h('div', {class: 'prize'});
  const fillPrize = c => { prize.textContent = ''; prize.append(h('div', {class: 'tier', text: SCRATCH_TIERS[c.tier][0]}), h('div', {class: 'pz', text: c.prize}), h('div', {class: 'by', text: nameOf(other(c.who)) + ' 请客'})); box.classList.toggle('t1', c.tier === 0); };

  let ctx, w, hgt, drawn = card, cardId = card ? card.id : null, moves = 0, done = false, last = null;
  const paint = () => {
    const r = box.getBoundingClientRect(); if (!r.width) return;
    const dpr = window.devicePixelRatio || 1; w = r.width; hgt = r.height;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr);
    ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    const g = ctx.createLinearGradient(0, 0, w, hgt); g.addColorStop(0, '#C9CDD3'); g.addColorStop(.5, '#EEF0F3'); g.addColorStop(1, '#B9BEC6');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, hgt);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    for (let i = 0; i < 90; i++){ ctx.beginPath(); ctx.arc(Math.random() * w, Math.random() * hgt, Math.random() * 1.6 + .4, 0, 7); ctx.fill(); }

        Store.put(cur ? cur.id : 'p_' + uid(), 'place', {city: city.value.trim(), name: name.value.trim(), date: date.value, note: note.value.trim(), by: S.me, at: cur ? cur.at : Date.now()});
        closeSheet(); toast(cur ? '改好了' : '盖章成功'); haptic();
      }}),
      cur ? h('button', {class: 'btn block ghost danger', text: '删除', onclick: () => confirmSheet('删除「' + cur.city + (cur.name ? ' · ' + cur.name : '') + '」？', '删除', () => { Store.remove(cur.id); toast('删掉了'); })}) : null)));
}

/* =============== us: TA 的说明书 / 留言 =============== */
const MANUAL = [['food', '爱吃的'], ['nofood', '不吃的 / 过敏的'], ['drink', '奶茶、咖啡怎么点'], ['size', '尺码（衣服、鞋、戒指）'], ['like', '喜欢的花、颜色、牌子'], ['wish', '最近想要的东西'], ['mine', '雷区：千万别做的事'], ['coax', '不开心的时候怎么哄'], ['other', '其他要记住的']];
function usPage(){
  const p = h('div', {class: 'page'});
  if (!S.usSeg) S.usSeg = 'manual';
  pageHead(p, '我们', S.usSeg === 'manual' ? '记下对方的喜好和雷区' : '写给彼此的小便签', [['manual', '说明书'], ['notes', '留言', unreadNotes() > 0]], 'usSeg');
  if (S.usSeg === 'manual') manualView(p); else { notesView(p); seenLater('notes'); }
  return p;
}
function manualView(p){
  if (!S.manualWho) S.manualWho = other(S.me);
  const who = S.manualWho;
  p.append(h('div', {class: 'mwho', role: 'group'}, ['A', 'B'].map(k => h('button', {'aria-pressed': String(who === k), onclick: () => { S.manualWho = k; render(); }}, avatar(k), h('span', {text: nameOf(k) + ' 的说明书'})))));
  const filled = MANUAL.filter(([k]) => (Store.get('m_' + who + '_' + k) || {}).text).length;
  const list = h('div', {class: 'card mlist'});
  MANUAL.forEach(([k, label]) => {
    const it = Store.get('m_' + who + '_' + k);
    list.append(h('button', {class: 'mrow', onclick: () => manualSheet(who, k, label)},
      h('div', {class: 'k'}, h('span', {text: label}), it && it.text ? h('span', {style: {fontWeight: 500}, text: nameOf(it.by) + ' 记的'}) : null),
      h('div', {class: 'v' + (it && it.text ? '' : ' dim'), text: it && it.text ? it.text : (who === S.me ? '告诉 TA：点这里写' : '还不知道？点这里记下来')})));
  });
  p.append(list);
  p.append(h('p', {class: 'hint', style: {textAlign: 'center', marginTop: '16px'}, text: filled + ' / ' + MANUAL.length + ' 项已记下 · 两个人都可以补充和修改'}));
}
function manualSheet(who, k, label){
  const it = Store.get('m_' + who + '_' + k);
  const ta = h('textarea', {class: 'bigta', id: 'mT', maxlength: '300', style: {minHeight: '140px'}, placeholder: '写下来，买礼物、点外卖的时候就不用猜了'});
  if (it) ta.value = it.text || '';
  openSheet(nameOf(who) + ' · ' + label, h('div', null, ta, h('button', {class: 'btn block', text: '保存', onclick: () => {
    const text = ta.value.trim();
    if (text) Store.put('m_' + who + '_' + k, 'manual', {who, key: k, text, by: S.me, at: Date.now()});
    else if (it) Store.remove('m_' + who + '_' + k);
    closeSheet(); toast('记下了');
  }})));
}

/* =============== settings =============== */
function settingsSheet(){
  const i = info();
  const f = (id, type, val, ph) => { const e = h('input', {type, id, placeholder: ph || ''}); if (val) e.value = val; if (type === 'text') e.maxLength = 12; return e; };
  const nA = f('sA', 'text', i.nameA), nB = f('sB', 'text', i.nameB), sd = f('sS', 'date', i.start), bA = f('sBA', 'date', i.birthA), bB = f('sBB', 'date', i.birthB);
  const photoRow = (label, k) => h('button', {class: 'field btnrow', onclick: () => k === 'cover' ? setCover().then(settingsSheet) : setAvatar(k).then(settingsSheet)},
    h('span', {text: label}), h('span', {class: 'val'}, k === 'cover' ? h('span', {text: photo('cover') ? '已设置' : '未设置'}) : avatar(k), h('span', {html: I.chev, class: 'chev', style: {display: 'contents'}})));
  const body = h('div', null,
    h('div', {style: {fontSize: '12px', color: 'var(--muted)', fontWeight: 600, margin: '0 4px 6px'}, text: '我们'}),
    h('div', {class: 'group'},
      h('label', {class: 'field'}, h('span', {text: '名字 1'}), nA),
      h('label', {class: 'field'}, h('span', {text: '名字 2'}), nB),
      h('label', {class: 'field'}, h('span', {text: '在一起的日子'}), sd),
      h('label', {class: 'field'}, h('span', {text: (i.nameA || '1') + ' 的生日'}), bA),
      h('label', {class: 'field'}, h('span', {text: (i.nameB || '2') + ' 的生日'}), bB)),
    h('button', {class: 'btn block', style: {marginBottom: '22px'}, text: '保存', onclick: () => {
      if (!nA.value.trim() || !nB.value.trim() || !sd.value){ toast('名字和在一起的日子要填'); return; }
      Store.put('info', 'info', {nameA: nA.value.trim(), nameB: nB.value.trim(), start: sd.value, birthA: bA.value || '', birthB: bB.value || ''});
      closeSheet(); toast('保存好了');
    }}),
    h('div', {style: {fontSize: '12px', color: 'var(--muted)', fontWeight: 600, margin: '0 4px 6px'}, text: '照片'}),
    h('div', {class: 'group'}, photoRow('首页合照', 'cover'), photoRow(nameOf('A') + ' 的头像', 'A'), photoRow(nameOf('B') + ' 的头像', 'B')),
    h('div', {style: {fontSize: '12px', color: 'var(--muted)', fontWeight: 600, margin: '0 4px 6px'}, text: '这台手机是谁的'}),
    h('div', {class: 'who2'}, ['A', 'B'].map(k => h('button', {'aria-pressed': String(S.me === k), onclick: () => { S.me = k; lsSet('od-me', k); writeUrl(); closeSheet(); render(); toast('现在是 ' + nameOf(k)); }}, avatar(k), nameOf(k)))),
    h('div', {style: {fontSize: '12px', color: 'var(--muted)', fontWeight: 600, margin: '0 4px 6px'}, text: '邀请 ' + nameOf(other(S.me))}),
    inviteBlock());
  openSheet('设置', body);
}
function inviteBlock(){
  if (!REMOTE) return h('p', {class: 'hint', text: '同步功能还没开通。开通后这里会出现一个邀请链接，发给对方，两个人就能看到同一份内容。'});
  const link = inviteLink();
  const copy = async (txt, ok) => { try { await navigator.clipboard.writeText(txt); toast(ok); } catch { toast('长按上面的文字也能复制'); } };
  const share = async () => { if (navigator.share){ try { await navigator.share({title: '我们的小日子', text: '点开这个链接，加入我们的小日子：', url: link}); } catch {} } else copy(link, '链接已复制，发给 TA 吧'); };
  return h('div', null,
    h('div', {class: 'codebox', text: fmtCode(S.room)}),
    h('p', {class: 'hint', text: '把邀请链接发给 ' + nameOf(other(S.me)) + '，TA 点开就能进来，不用注册。也可以在开始页选“我有邀请码”，输入上面这串暗号。别把它发给别人哦。'}),
    h('div', {class: 'actions'},
      h('button', {class: 'btn block', onclick: share}, '发送邀请链接'),
      h('button', {class: 'btn block ghost', onclick: () => copy(fmtCode(S.room), '暗号已复制')}, '复制暗号')));
}

/* =============== onboarding =============== */
function feat(ic, tone, text){ return h('div', null, h('span', {class: 'dic ' + tone, html: I[ic]}), h('span', {text})); }
function welcomePage(){
  $('#tabbar').hidden = true;
  const root = $('#root'); root.textContent = '';
  root.append(h('div', {class: 'ob'},
    h('div', {class: 'art'},
      h('img', {class: 'logo', src: 'icons/icon-512.png', alt: ''}),
      h('h1', {text: '我们的小日子'}),
      h('p', {class: 'lead', text: '只属于你们两个人的小本子'}),
      h('div', {class: 'feat'},
        feat('mail', 'rose', '提前写好的信，TA 累了委屈了就能拆开'),
        feat('rings', 'gold', '在一起的天数、纪念日和生日'),
        feat('book', 'mint', 'TA 的说明书、爱的小券、一起去过的地方'))),
    h('div', {class: 'actions'},
      h('button', {class: 'btn block', text: '创建我们的空间', onclick: createPage}),
      h('button', {class: 'btn block ghost', text: '我有邀请码', onclick: joinPage}))));
}
function createPage(){
  const root = $('#root'); root.textContent = '';
  const f = (id, type, ph) => { const e = h('input', {type, id, placeholder: ph || ''}); if (type === 'text') e.maxLength = 12; return e; };
  const nA = f('cA', 'text', '比如：小鱼'), nB = f('cB', 'text', '比如：阿星'), sd = f('cS', 'date'), bA = f('cBA', 'date'), bB = f('cBB', 'date');
  root.append(h('div', {class: 'ob'},
    h('button', {class: 'back', onclick: welcomePage}, h('span', {html: I.back, style: {display: 'contents'}}), '返回'),
    h('h2', {text: '先认识一下你们'}),
    h('p', {class: 'hint', style: {marginTop: 0}, text: '填好就能开始数天数。以后都能在设置里改。'}),
    h('div', {class: 'group'},
      h('label', {class: 'field'}, h('span', {text: '你的名字'}), nA),
      h('label', {class: 'field'}, h('span', {text: 'TA 的名字'}), nB),
      h('label', {class: 'field'}, h('span', {text: '在一起的日子'}), sd)),
    h('div', {class: 'group'},
      h('label', {class: 'field'}, h('span', {text: '你的生日'}), bA),
      h('label', {class: 'field'}, h('span', {text: 'TA 的生日'}), bB)),
    h('p', {class: 'hint', style: {marginTop: '-6px'}, text: '生日可以先不填'}),
    h('div', {style: {flex: 1}}),
    h('button', {class: 'btn block', text: '开始我们的小日子', onclick: () => {
      if (!nA.value.trim() || !nB.value.trim() || !sd.value){ toast('名字和在一起的日子要填哦'); return; }
      const room = secret();
      S.tab = 'home';
      Store.open(room);
      Store.put('info', 'info', {nameA: nA.value.trim(), nameB: nB.value.trim(), start: sd.value, birthA: bA.value || '', birthB: bB.value || ''});
      enterRoom(room, 'A');
      if (REMOTE) setTimeout(() => { settingsSheet(); setTimeout(() => { const s = $('#sheet'); s.scrollTop = s.scrollHeight; }, 350); toast('把邀请链接发给 ' + nameOf('B')); }, 700);
    }})));
}
function joinPage(prefill){
  const root = $('#root'); root.textContent = '';
  const inp = h('input', {class: 'input', id: 'joinCode', type: 'text', placeholder: 'xxxx-xxxx-xxxx-xxxx-xxxx-xxxx', autocapitalize: 'off', autocomplete: 'off', spellcheck: 'false', style: {fontFamily: 'ui-monospace,Menlo,monospace', textAlign: 'center'}});
  if (prefill) inp.value = fmtCode(prefill);
  const btn = h('button', {class: 'btn block', text: '加入', onclick: async () => {
    const code = cleanCode(inp.value);
    if (code.length < 20){ toast('暗号不完整，再检查一下'); return; }
    if (!REMOTE){ toast('同步还没开通，暂时不能加入'); return; }
    btn.disabled = true; btn.textContent = '正在加入…';
    Store.open(code); const ok = await Store.pull();
    btn.disabled = false; btn.textContent = '加入';
    if (!ok){ toast('连不上网，稍后再试'); return; }
    if (!Store.get('info')){ toast('没找到这个空间，暗号可能不对'); return; }
    S.room = code; lsSet('od-room', code); S.me = null; writeUrl(); Store.start(); render();
  }});
  root.append(h('div', {class: 'ob'},
    h('button', {class: 'back', onclick: welcomePage}, h('span', {html: I.back, style: {display: 'contents'}}), '返回'),
    h('h2', {text: '输入邀请暗号'}),
    h('p', {class: 'hint', style: {marginTop: 0}, text: '在对方手机的「设置 → 邀请」里能看到，一共 24 个字母和数字。直接点对方发来的邀请链接会更省事。'}),
    inp, h('div', {style: {flex: 1, minHeight: '24px'}}), btn));
}
function pickWhoPage(){
  const p = h('div', {class: 'ob'},
    h('div', {class: 'art'},
      h('div', {class: 'pair', style: {transform: 'scale(1.6)', marginBottom: '18px'}}, avatar('A'), avatar('B')),
      h('h2', {text: '欢迎来到你们的小日子'}),
      h('p', {class: 'lead', text: '这台手机是谁的？'}),
      h('div', {class: 'who2', style: {width: '100%', maxWidth: '340px'}},
        ['A', 'B'].map(k => h('button', {onclick: () => { S.me = k; lsSet('od-me', k); writeUrl(); haptic(); render(); toast('你好，' + nameOf(k)); }}, avatar(k), nameOf(k))))));
  return p;
}
function waitingPage(){
  return h('div', {class: 'ob'}, h('div', {class: 'art'}, h('img', {class: 'logo', src: 'icons/icon-512.png', alt: ''}), h('p', {class: 'lead', text: '正在打开你们的小日子…'}), syncLine()));
}

/* =============== boot =============== */
(function boot(){
  inAppBanner();
  const u = readUrl();
  const savedRoom = lsGet('od-room', null);
  const room = u.room || savedRoom;
  if (room && room.length >= 20){
    S.room = room;
    S.me = (u.me === 'A' || u.me === 'B') ? u.me : (room === savedRoom ? lsGet('od-me', null) : null);
    lsSet('od-room', room); if (S.me) lsSet('od-me', S.me);
    Store.open(room); writeUrl(); Store.start(); render();
  } else welcomePage();
  setInterval(() => { if (S.room && !$('#sheet').classList.contains('show') && !document.hidden && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') render(); }, 60 * 60 * 1000);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
</script>
